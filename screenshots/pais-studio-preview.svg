    <text x="36" y="66" font-family="monospace" font-size="11" fill="#34d399">&lt;collectionGroups count="2"&gt;&lt;collectionGroup ID="COL-SCIENCE-IMG" minOccurs="1" maxOccurs="100"/&gt;&lt;/collectionGroups&gt;</text>
